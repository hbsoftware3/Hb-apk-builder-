name: Build APK

on: {workflow_dispatch: {inputs: {slug: {description: "App id", required: true}, zip_path: {description: "Zip path", required: true}, notes: {description: "Update notes", required: false, default: ""}}}}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build, sign and publish
        env:
          SLUG: ${{ inputs.slug }}
          ZIP_PATH: ${{ inputs.zip_path }}
          NOTES: ${{ inputs.notes }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          [[ "$SLUG" =~ ^[a-z0-9-]{1,40}$ ]] || { echo "Bad app id: $SLUG"; exit 1; }
          [ -n "$KS_PASS" ] || { echo "Secret KEYSTORE_PASSWORD is missing. Add it in Settings > Secrets and variables > Actions."; exit 1; }
          [ -f "$ZIP_PATH" ] || { echo "Zip not found: $ZIP_PATH"; exit 1; }

          git config user.name "hb-builder"
          git config user.email "hb-builder@users.noreply.github.com"

          # One fixed signing key per app, so every new APK installs over the old one.
          mkdir -p keys
          KS="$PWD/keys/$SLUG.jks"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -keystore "$KS" -storepass "$KS_PASS" -alias hb -keypass "$KS_PASS" \
              -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=$SLUG"
            git add "keys/$SLUG.jks"
            git commit -m "Add signing key for $SLUG"
            git push
          fi

          rm -rf work && mkdir work
          unzip -q "$ZIP_PATH" -d work
          GRADLEW="$(find work -type f -name gradlew | head -n 1)"
          [ -n "$GRADLEW" ] || { echo "No gradlew found in the zip."; exit 1; }
          DIR="$(dirname "$GRADLEW")"
          chmod +x "$GRADLEW"

          # Point the app's update check at this app's release file.
          export URL="https://github.com/$GITHUB_REPOSITORY/releases/download/app-$SLUG/update-v1.json"
          grep -rl --include=build.gradle --include=build.gradle.kts "raw.githubusercontent.com" "$DIR" | while read -r f; do
            perl -pi -e 's#https://raw\.githubusercontent\.com/\$repoSlug/main/update-v1\.json#$ENV{URL}#g' "$f"
          done

          cat > /tmp/sign.init.gradle <<'GRADLE'
          allprojects { p ->
            p.afterEvaluate {
              if (p.plugins.hasPlugin('com.android.application')) {
                def cfg = p.android.signingConfigs.create('hbkey')
                cfg.storeFile = new File(System.getenv('HB_KS'))
                cfg.storePassword = System.getenv('HB_PASS')
                cfg.keyAlias = 'hb'
                cfg.keyPassword = System.getenv('HB_PASS')
                p.android.buildTypes.getByName('debug').signingConfig = cfg
              }
            }
          }
          GRADLE

          (cd "$DIR" && HB_KS="$KS" HB_PASS="$KS_PASS" ./gradlew --no-daemon -I /tmp/sign.init.gradle assembleDebug)

          APK="$(find "$DIR" -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"
          [ -n "$APK" ] || { echo "APK not found after build."; exit 1; }

          VC="$(grep -rhoE --include=build.gradle --include=build.gradle.kts 'versionCode[ =]+[0-9]+' "$DIR" | head -n 1 | grep -oE '[0-9]+' || true)"
          VN="$(grep -rhoE --include=build.gradle --include=build.gradle.kts 'versionName[ =]+"[^"]*"' "$DIR" | head -n 1 | cut -d'"' -f2 || true)"
          VC="${VC:-1}"; VN="${VN:-1.0}"

          mkdir -p out
          cp "$APK" "out/$SLUG.apk"
          SHA="$(sha256sum "out/$SLUG.apk" | cut -d' ' -f1)"
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/app-$SLUG/$SLUG.apk"
          jq -n --argjson vc "$VC" --arg vn "$VN" --arg url "$APK_URL" --arg sha "$SHA" --arg notes "$NOTES" \
            '{versionCode:$vc, versionName:$vn, apkUrl:$url, minVersionCode:$vc, notes:$notes, sha256:$sha}' > out/update-v1.json

          gh release delete "app-$SLUG" --cleanup-tag -y || true
          gh release create "app-$SLUG" "out/$SLUG.apk" out/update-v1.json \
            --title "$SLUG $VN" --notes "${NOTES:-Build $VN ($VC)}"

          # Remove the uploaded zip so the repository stays small.
          git rm -q "$ZIP_PATH" && git commit -q -m "Remove built zip for $SLUG" && git push || true
